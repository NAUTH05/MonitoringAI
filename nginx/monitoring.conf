# nginx site config cho monitoringAI.
# Cài:  sudo cp nginx/monitoring.conf /etc/nginx/sites-available/monitoring
#       sudo ln -s /etc/nginx/sites-available/monitoring /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#
# Upstream trỏ đến backend (127.0.0.1:4000) và frontend (127.0.0.1:3000) chạy local.
# File này đặt trong http{} của nginx.conf mặc định (Debian include sites-enabled/*).

upstream monitoring_backend {
    server 127.0.0.1:4000;
}
upstream monitoring_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://monitoring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Evidence media (ảnh/video do backend phục vụ) ───────────────────────
    location /evidence/ {
        proxy_pass http://monitoring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Socket.IO (WebSocket) ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://monitoring_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass http://monitoring_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

services:
  # ── go2rtc: RTSP → HLS gateway ────────────────────────────────────────────────
  # Browser cần kết nối trực tiếp đến port này để lấy HLS stream
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: monitoring_go2rtc
    ports:
      - "1984:1984"       # HLS + Web API (browser cần truy cập trực tiếp)
      - "8554:8554"       # RTSP re-stream
    volumes:
      # read-write so stream changes made via the UI persist back to the yaml
      - ./go2rtc.yaml:/config/go2rtc.yaml:rw
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: monitoring_postgres
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring_pass
      POSTGRES_DB: smart_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d smart_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend API ────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: monitoring_backend
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring_pass@postgres:5432/smart_monitoring
      GO2RTC_API_URL: http://go2rtc:1984
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      go2rtc:
        condition: service_started
    restart: unless-stopped

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SOCKET_URL: ""
        NEXT_PUBLIC_GO2RTC_URL: http://${SERVER_HOST:-localhost}:1984
    container_name: monitoring_frontend
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx reverse proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: monitoring_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
